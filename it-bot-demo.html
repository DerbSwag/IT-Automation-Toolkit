<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>IT Support Bot - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:#16213e;padding:16px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;color:#4fc3f7}
header span{font-size:13px;color:#888}
#chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:12px;line-height:1.6;white-space:pre-wrap}
.user{align-self:flex-end;background:#0f3460;color:#e0e0e0}
.bot{align-self:flex-start;background:#1a1a2e;border:1px solid #333;color:#e0e0e0}
.typing{color:#888;font-style:italic}
#input-area{background:#16213e;padding:16px 24px;display:flex;gap:12px}
#input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid #333;background:#0f3460;color:#fff;font-size:15px;outline:none}
#input:focus{border-color:#4fc3f7}
button{padding:12px 24px;background:#4fc3f7;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
button:hover{background:#81d4fa}
button:disabled{background:#555;cursor:not-allowed}
</style>
</head>
<body>
<header>
<h1>🤖 IT Support Bot</h1>
<span>Powered by Ollama (local AI) — ข้อมูลไม่ออกนอกเครื่อง</span>
</header>
<div id="chat"></div>
<div id="input-area">
<input id="input" placeholder="พิมพ์คำถาม เช่น ปริ้นไม่ออก, ลืมรหัสผ่าน..." autofocus>
<button onclick="send()">ส่ง</button>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

async function send(){
  const q=input.value.trim();if(!q)return;
  input.value='';
  addMsg(q,'user');
  const typing=addMsg('กำลังคิด...','bot typing');
  try{
    const res=await fetch('http://localhost:11434/api/generate',{
      method:'POST',
      body:JSON.stringify({model:'it-bot',prompt:q,stream:false})
    });
    const data=await res.json();
    typing.textContent=data.response.trim();
    typing.classList.remove('typing');
  }catch(e){
    typing.textContent='❌ ไม่สามารถเชื่อมต่อ Ollama ได้ — ตรวจสอบว่า Ollama กำลังทำงานอยู่';
    typing.classList.remove('typing');
  }
}

function addMsg(text,cls){
  const div=document.createElement('div');
  div.className='msg '+cls;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}
</script>
</body>
</html>
